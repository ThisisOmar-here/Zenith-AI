services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: ["qdrant-data:/qdrant/storage"]

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      QDRANT_URL: http://qdrant:6333
      ZENITH_CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on: [qdrant]

volumes:
  qdrant-data:
