[project]
name = "zenith"
version = "1.0.0"
description = "A retrieval-grounded mental well-being companion (HyDE + Qdrant + tool-calling LLM)."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Omar Albarghouthi" }]
dependencies = [
  "langchain-core>=0.3,<0.4",
  "langchain-groq>=0.2,<0.4",
  "langchain-nvidia-ai-endpoints>=0.3,<0.4",
  "langchain-qdrant>=0.2,<0.3",
  "langchain-text-splitters>=0.3,<0.4",
  "qdrant-client>=1.12",
  "pymupdf>=1.24",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zenith*"]

[tool.setuptools.package-data]
zenith = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
